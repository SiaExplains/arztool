appId: de.arztool.app
productName: Arztool
copyright: Copyright © 2026 Siavash Ghanbari

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json

asar: true

# Electron fuses — disable Node-as-a-backdoor entry points in the shipped binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.medical
  # Default: ad-hoc signature. Flipping fuses rewrites the binary, and Apple Silicon
  # SIGKILLs any binary whose signature is invalid — an unsigned build won't launch.
  # Hardened runtime is off here because it rejects ad-hoc-signed Electron frameworks;
  # the signed + notarized release path (M5) overrides identity and enables it.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

publish:
  provider: github
  owner: SiaExplains
  repo: arztool
  releaseType: draft
