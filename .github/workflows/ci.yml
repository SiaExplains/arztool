name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Builds must succeed unsigned when signing secrets are absent (forks, PRs).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Electron 44 downloads its binary lazily; fetch it up front so E2E doesn't race it.
      - run: node node_modules/electron/install.js

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: pnpm package:mac

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: pnpm package:win

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
