name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

      # Signing is opt-in (ARZTOOL_SIGN=1) and secret-driven; see build/signing.cjs and
      # docs/RELEASING.md. Any secret that is not configured arrives as "" and the build
      # falls back to ad-hoc / unsigned with a warning instead of failing.
      - name: Write App Store Connect API key for notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Publish to draft release
        shell: bash
        env:
          ARZTOOL_SIGN: '1'
          # macOS — Developer ID Application certificate (.p12, base64) + notarization
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows — Azure Trusted Signing (preferred) …
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          # … or an OV/EV certificate (.pfx, base64)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Without a mac certificate, stop electron-builder from grabbing a random keychain identity.
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ "$RUNNER_OS" = "macOS" ]; then target=--mac; else target=--win; fi
          pnpm exec electron-builder $target --publish always

      - name: Report signatures (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d release/*/mac-universal/Arztool.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority|Signature|TeamIdentifier' || true
          spctl -a -vvv -t exec "$app" || echo "::warning::Gatekeeper rejects this build (expected while unsigned/not notarized)"

      - name: Report signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release/*/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Host "::warning::$($_.Name) is not validly signed (expected while unsigned)" }
          }
